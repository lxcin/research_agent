name: CI

on:
  push:
    branches: [master, "feat/*"]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: research-agent

      - name: Run tests
        run: |
          pip install pytest-timeout
          PYTHONPATH=src pytest tests/ -q --tb=short -p no:cacheprovider
        working-directory: research-agent

      - name: Check credentials
        run: |
          if grep -rPn "sk-[a-zA-Z0-9]{20,}" src/; then echo "WARNING: API key found" >&2; fi
        working-directory: research-agent

      - name: Verify docs
        run: |
          test -f docs/SPEC.md && echo "SPEC OK"
          test -f docs/PLAN.md && echo "PLAN OK"
          test -f docs/V4_PLAN.md && echo "V4_PLAN OK"
          test -f docs/SPEC_PROCESS.md && echo "PROCESS OK"
          test -f docs/AGENT_LOG.md && echo "LOG OK"
          test -f docs/REFLECTION.md && echo "REFLECTION OK"
        working-directory: research-agent

      - name: Run mechanism demo
        run: PYTHONPATH=src python tests/demo_mechanisms.py
        working-directory: research-agent

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t pp-backend:ci .
        working-directory: research-agent
      - name: Push backend image to GHCR
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag pp-backend:ci ghcr.io/${{ github.repository }}/pp-backend:latest
          docker push ghcr.io/${{ github.repository }}/pp-backend:latest