[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "4.2.0"
description = "A general-purpose personal assistant agent harness with a replaceable kernel and pluggable capabilities"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "litellm>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "jieba>=0.42",
]

[project.optional-dependencies]
# Optional: semantic memory embedding layer (memory/vector.py). Falls back to
# keyword search when unavailable.
vector = [
    "chromadb>=0.5",
    "sentence-transformers>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]