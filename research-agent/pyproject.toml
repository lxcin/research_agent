[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "4.3.0"
description = "A general-purpose personal assistant agent harness with a replaceable kernel and pluggable capabilities"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.18",
    "litellm>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "numpy>=1.24",
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "jieba>=0.42",
]

[project.optional-dependencies]
# Optional: episodic-memory embedding layer (research_agent/embedding.py). Falls
# back to jieba/keyword recall when unavailable.
vector = [
    "sentence-transformers>=2.0",
]
# Optional: document extraction for the network plugin (web_fetch).
# trafilatura = high-quality HTML→text (falls back to built-in regex stripper);
# pypdf = PDF text-layer extraction (falls back to a clear "parser unavailable").
web = [
    "trafilatura>=1.6",
    "pypdf>=4.0",
]
# Optional: attachment parsing (research_agent.attachments).
# Pillow = image downscale/compress; the rest parse Office documents to text.
attach = [
    "Pillow>=10.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]